name: secrets-and-variables

on:
  workflow_dispatch:

jobs:
  print-production:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: echo "MY_ENVIRONMENT is ${{ vars.MY_ENVIRONMENT }}"

  print-development:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - run: echo "MY_ENVIRONMENT is ${{ vars.MY_ENVIRONMENT }}"

  print-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Print secret
        env:
          DEMO_USER: ${{ secrets.JB_DEMO_USER }}
        run: echo "JB_DEMO_USER is $DEMO_USER"
