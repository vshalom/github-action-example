name: pipeline-skeleton

on:
  workflow_dispatch:

env:
  IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/github-action-example

jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Stage - Start"

  scm-pull:
    runs-on: ubuntu-latest
    needs: start
    steps:
      - run: echo "Stage - SCM pull"

  docker-build:
    runs-on: ubuntu-latest
    needs: scm-pull
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Docker build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: false
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:${{ github.run_number }}

  trivy-scan:
    runs-on: ubuntu-latest
    needs: scm-pull
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.3.1

      - name: Print Trivy version
        run: trivy --version

      - name: Scan repository filesystem
        run: trivy fs --severity HIGH,CRITICAL --exit-code 1 .

  bandit-scan:
    runs-on: ubuntu-latest
    needs: scm-pull
    steps:
      - run: echo "Stage - Bandit scan"

  sonarqube:
    runs-on: ubuntu-latest
    needs: scm-pull
    steps:
      - run: echo "Stage - SonarQube"

  docker-push:
    runs-on: ubuntu-latest
    needs: [docker-build, trivy-scan, bandit-scan, sonarqube]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Docker login
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker build and push
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:${{ github.run_number }}

  unit-test:
    runs-on: ubuntu-latest
    needs: [docker-build, trivy-scan, bandit-scan, sonarqube]
    steps:
      - run: echo "Stage - Unit test"

  deploy:
    runs-on: ubuntu-latest
    needs: [docker-push, unit-test]
    steps:
      - run: echo "Stage - Deploy"

  test:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - run: echo "Stage - Test"

  post-install:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - run: echo "Stage - Post install"
